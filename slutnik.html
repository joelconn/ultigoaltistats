<title>Slutnik Stats</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
header { padding: 18px 20px 10px; }
header h1 { margin: 0 0 2px; font-size: 22px; }
header p { margin: 0; color: #999; font-size: 13px; }
.sheets-link { display: inline-block; margin-top: 8px; color: #26ff66; font-size: 12px; font-weight: 700; text-decoration: none; }
.sheets-link:hover { text-decoration: underline; }
.tabs { display: flex; gap: 8px; padding: 0 20px 12px; overflow-x: auto; }
.tab { padding: 8px 16px; border-radius: 8px; background: #1a1a1a; color: #999; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; border: none; }
.tab.active { background: #26ff66; color: #000; }
.panel { display: none; padding: 0 20px 40px; }
.panel.active { display: block; }
select { background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 8px 10px; font-size: 14px; margin-bottom: 14px; }
.summary-cards { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.card { background: #1a1a1a; border-radius: 10px; padding: 12px 16px; min-width: 110px; }
.card .label { color: #999; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.card .value { font-size: 22px; font-weight: 800; margin-top: 2px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid #222; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: #000; }
th { position: sticky; top: 0; background: #000; color: #999; font-weight: 700; cursor: pointer; user-select: none; font-size: 11px; text-transform: uppercase; z-index: 10; }
th:hover { color: #26ff66; }
th.sorted::after { content: ' \25BC'; }
th.sorted-asc::after { content: ' \25B2'; }
tbody tr:hover { background: #111; }
td.computed { color: #6cf; }
.table-wrap { overflow-x: auto; border: 1px solid #222; border-radius: 10px; }
.toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
button.action { background: #1a1a1a; color: #26ff66; border: 1px solid #26ff66; border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
button.action:hover { background: #102; }
.hint { color: #777; font-size: 11px; margin-bottom: 10px; }
.legend { background: #14140f; border: 1px solid #2a2a1a; border-radius: 10px; padding: 10px 14px; color: #999; font-size: 11px; margin-bottom: 12px; line-height: 1.6; }
.legend b { color: #ccc; }
.legend-title { color: #ffd400; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
td.player-link { cursor: pointer; color: #6cf; text-decoration: underline; }
.leaderboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.leader-card { background: #1a1a1a; border-radius: 10px; padding: 12px 14px; }
.leader-title { color: #999; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.leader-name { color: #ffd400; font-size: 18px; font-weight: 800; margin-bottom: 6px; }
.leader-stat { color: #ccc; font-size: 12px; }
.leader-none { color: #555; font-size: 13px; }
.bubble-chart { position: relative; width: 100%; height: 260px; background: #111; border-radius: 10px; overflow: hidden; margin-top: 4px; }
.bubble-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #777; font-size: 13px; }
.bubble { position: absolute; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #000; font-weight: 700; }
.bubble-count { font-size: 13px; }
.bubble-name { font-size: 9px; font-weight: 600; max-width: 90%; overflow: hidden; }
.bubble-legend { display: flex; gap: 12px; flex-wrap: wrap; margin: 8px 0; font-size: 11px; color: #999; }
.bubble-legend span { display: inline-flex; align-items: center; gap: 4px; }
.bubble-legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; overflow-y: auto; padding: 20px; }
.overlay-panel { max-width: 700px; margin: 0 auto; }
.overlay-panel h2 { margin: 16px 0 4px; }
.overlay-panel h3 { margin-bottom: 4px; }
</style>

// MARK: - Box score computation (mirrors StatsCalculator.compute in Swift)

function emptyRow(player) {
  return {
    id: player.id, name: player.name, number: player.number,
    goals: 0, assists: 0, catches: 0, completions: 0, drops: 0, throwaways: 0,
    stalls: 0, blocks: 0, pulls: 0, pullsIB: 0, pullsOOB: 0, totalHangTime: 0,
    defensiveBreaks: 0,
    greatests: 0, callahansCaught: 0, callahansThrown: 0,
    twoPointGoals: 0, twoPointAssists: 0, twoPointTurnovers: 0, assistAttempts: 0, scoredOn: 0,
    pointsPlayed: 0, oPoints: 0, dPoints: 0,
    plusMinus: 0, oPlusMinus: 0, dPlusMinus: 0,
    onFieldGoalsFor: 0, onFieldGoalsAgainst: 0,
    oLinePointsPlayed: 0, oLineGoalsCredit: 0, oLineBreaks: 0,
    dLinePointsPlayed: 0, dLineGoalsCredit: 0, dLineBreaks: 0,
    oPointsTeamScored: 0, pointsWithTurnovers: 0, pointsRecoveredAfterTurnover: 0,
    offensiveOutput: 0,
    totalThrowaways: 0  // Total turnovers = throwaways + assistAttempts (goal misses)
  };
}

function credit(stats, id, amount, offense) {
  if (!id || !stats[id]) return;
  stats[id].plusMinus += amount;
  if (offense) stats[id].oPlusMinus += amount; else stats[id].dPlusMinus += amount;
}

function computeBoxScore(roster, points) {
  const stats = {};
  roster.forEach(p => { stats[p.id] = emptyRow(p); });

  points.forEach(point => {
    const isOffensePoint = point.startingPossession === "offense";
    point.lineup.forEach(id => {
      if (!stats[id]) return;
      stats[id].pointsPlayed += 1;
      if (isOffensePoint) {
        stats[id].oPoints += 1;
        stats[id].oLinePointsPlayed += 1;
      } else {
        stats[id].dPoints += 1;
        stats[id].dLinePointsPlayed += 1;
      }
    });

    point.plays.forEach(e => {
      const p1 = e.player1Id, p2 = e.player2Id;
      switch (e.type) {
        case "pull":
          if (p1 && stats[p1]) { stats[p1].pulls += 1; if (e.hangTime) stats[p1].totalHangTime += e.hangTime; }
          break;
        case "pullCaught":
          if (p1 && stats[p1]) { stats[p1].pullsIB += 1; if (e.hangTime) stats[p1].totalHangTime += e.hangTime; }
          break;
        case "pullOOB":
          if (p1 && stats[p1]) { stats[p1].pullsOOB += 1; if (e.hangTime) stats[p1].totalHangTime += e.hangTime; }
          break;
        case "pass":
          if (p1 && stats[p1]) stats[p1].completions += 1;
          if (p2 && stats[p2]) stats[p2].catches += 1;
          break;
        case "goal":
          if (p1 && stats[p1]) { stats[p1].goals += 1; stats[p1].catches += 1; }
          if (p2 && stats[p2]) { stats[p2].assists += 1; stats[p2].completions += 1; }
          credit(stats, p1, 1, true); credit(stats, p2, 1, true);
          point.lineup.forEach(id => {
            if (stats[id]) {
              stats[id].onFieldGoalsFor += 1;
              if (isOffensePoint) stats[id].oLineGoalsCredit += 1;
              else stats[id].dLineGoalsCredit += 1;
            }
          });
          break;
        case "twoPointGoal":
          if (p1 && stats[p1]) { stats[p1].twoPointGoals += 1; stats[p1].catches += 1; }
          if (p2 && stats[p2]) { stats[p2].twoPointAssists += 1; stats[p2].completions += 1; }
          credit(stats, p1, 2, true); credit(stats, p2, 2, true);
          point.lineup.forEach(id => {
            if (stats[id]) {
              stats[id].onFieldGoalsFor += 1;
              if (isOffensePoint) stats[id].oLineGoalsCredit += 1;
              else stats[id].dLineGoalsCredit += 1;
            }
          });
          break;
        case "drop":
          if (p1 && stats[p1]) stats[p1].drops += 1;
          credit(stats, p1, -1, true);
          break;
        case "throwaway":
          if (p1 && stats[p1]) stats[p1].throwaways += 1;
          credit(stats, p1, -1, true);
          break;
        case "twoPointThrowaway":
          if (p1 && stats[p1]) { stats[p1].throwaways += 1; stats[p1].twoPointTurnovers += 1; }
          credit(stats, p1, -1, true);
          break;
        case "stall":
          if (p1 && stats[p1]) stats[p1].stalls += 1;
          credit(stats, p1, -1, true);
          break;
        case "greatest":
          if (p1 && stats[p1]) stats[p1].greatests += 1;
          break;
        case "callahanCaught":
          if (p1 && stats[p1]) { stats[p1].callahansCaught += 1; stats[p1].catches += 1; }
          credit(stats, p1, 2, false);
          point.lineup.forEach(id => {
            if (stats[id]) {
              stats[id].onFieldGoalsFor += 1;
              if (isOffensePoint) stats[id].oLineGoalsCredit += 1;
              else stats[id].dLineGoalsCredit += 1;
            }
          });
          break;
        case "callahanThrown":
          if (p1 && stats[p1]) { stats[p1].callahansThrown += 1; stats[p1].throwaways += 1; }
          credit(stats, p1, -1, true);
          break;
        case "block":
          if (p1 && stats[p1]) { stats[p1].blocks += 1; stats[p1].defensiveBreaks += 1; }
          credit(stats, p1, 1, false);
          break;
        case "theyScored":
        case "scoredOnTwoPoint":
          point.lineup.forEach(id => {
            if (stats[id]) {
              stats[id].onFieldGoalsAgainst += 1;
              if (isOffensePoint) stats[id].oLineBreaks += 1;
              else stats[id].dLineBreaks += 1;
            }
          });
          break;
        case "assistAttempt":
          if (p1 && stats[p1]) stats[p1].assistAttempts += 1;
          credit(stats, p1, -1, true);
          break;
        default: break;
      }
    });
  });

  return Object.values(stats);
}

// MARK: - Derived stats (mirrors PlayerStats computed properties)

function computeDerived(row) {
  // Total turnovers = other turnovers (throwaways) + goal misses (assistAttempts)
  // This mirrors PlayerStats.totalThrowaways computed property in Swift
  row.totalThrowaways = row.throwaways + row.assistAttempts;

  // Note: plusMinus, oPlusMinus, dPlusMinus are already exported from the app
  // with overrides applied. Never recalculate them here, as aggregated data
  // would produce wrong results (sum of individual +/- values is correct,
  // but recalculating from aggregate base stats is wrong)

  row.touches = row.catches + row.goals + row.greatests;
  row.totalPulls = row.pullsOOB + row.pullsIB;
  row.offensiveOutput = row.goals + row.assists;
  const passAttempts = row.completions + row.throwaways + row.stalls + row.callahansThrown;
  row.passingPercentage = passAttempts > 0 ? Math.round(row.completions / passAttempts * 100) : null;
  const catchAttempts = row.catches + row.drops;
  row.catchingPercentage = catchAttempts > 0 ? Math.round(row.catches / catchAttempts * 100) : null;
  const goalAttempts = row.twoPointAssists + row.assistAttempts;
  row.scoringPercentage = goalAttempts > 0 ? Math.round(row.twoPointAssists / goalAttempts * 100) : null;
  row.averagePullHangtime = row.totalPulls > 0 ? Math.round(row.totalHangTime / row.totalPulls * 10) / 10 : null;
  row.oEfficiency = row.oPoints > 0 ? Math.round((row.goals + row.assists) / row.oPoints * 100) / 100 : null;
  row.dEfficiency = row.dPoints > 0 ? Math.round(row.blocks / row.dPoints * 100) / 100 : null;
  row.ppGoals = row.pointsPlayed > 0 ? Math.round(row.goals / row.pointsPlayed * 100) / 100 : 0;
  row.ppAssists = row.pointsPlayed > 0 ? Math.round(row.assists / row.pointsPlayed * 100) / 100 : 0;
  row.ppDs = row.pointsPlayed > 0 ? Math.round(row.blocks / row.pointsPlayed * 100) / 100 : 0;
  row.ppThrowaways = row.pointsPlayed > 0 ? Math.round(row.throwaways / row.pointsPlayed * 100) / 100 : 0;

  row.minutesPlayed = row.pointsPlayed * 2;
  row.goalsPerNinety = row.minutesPlayed > 0 ? Math.round(row.goals / row.minutesPlayed * 90 * 100) / 100 : 0;
  row.onFieldExpectedGoals = row.pointsPlayed > 0 ? Math.round(row.onFieldGoalsFor / row.pointsPlayed * 100) / 100 : 0;
  row.oLineEfficiency = row.oLinePointsPlayed > 0 ? Math.round((row.oLineGoalsCredit - row.oLineBreaks) / row.oLinePointsPlayed * 100) / 100 : null;
  row.dLineEfficiency = row.dLinePointsPlayed > 0 ? Math.round((row.dLineGoalsCredit - row.dLineBreaks) / row.dLinePointsPlayed * 100) / 100 : null;
}

function formatValue(v) {
  if (v === null || v === undefined) return "*";
  return String(v);
}

// MARK: - Scope resolution (which points feed a given table)

function getPoints(scope) {
  if (scope === "lifetime") return DATA.games.flatMap(g => g.points);
  if (scope.indexOf("tournament_") === 0) {
    const name = scope.slice("tournament_".length);
    return DATA.games.filter(g => g.tournament === name).flatMap(g => g.points);
  }
  if (scope.indexOf("game_") === 0) {
    const id = scope.slice("game_".length);
    const g = DATA.games.find(x => x.id === id);
    return g ? g.points : [];
  }
  return [];
}

function getGameOverrides(scope) {
  // For single game: return overrides from that game
  if (scope.indexOf("game_") === 0) {
    const id = scope.slice("game_".length);
    const g = DATA.games.find(x => x.id === id);
    return g ? g.statOverrides : null;
  }
  // For aggregate scopes (lifetime, tournament): combine overrides from all relevant games
  let combinedOverrides = {};
  let games = [];

  if (scope === "lifetime") {
    games = DATA.games;
  } else if (scope.indexOf("tournament_") === 0) {
    const name = scope.slice("tournament_".length);
    games = DATA.games.filter(g => g.tournament === name);
  }

  // Merge overrides from all games
  games.forEach(game => {
    if (game.statOverrides) {
      Object.entries(game.statOverrides).forEach(([playerId, fields]) => {
        if (!combinedOverrides[playerId]) {
          combinedOverrides[playerId] = {};
        }
        Object.assign(combinedOverrides[playerId], fields);
      });
    }
  });

  return Object.keys(combinedOverrides).length > 0 ? combinedOverrides : null;
}

function applyOverrides(rows, overrides) {
  if (!overrides) return;
  Object.entries(overrides).forEach(([playerId, fields]) => {
    const row = rows.find(r => r.id === playerId);
    if (!row) return;
    Object.entries(fields).forEach(([field, value]) => {
      if (field === "plusMinus") row.plusMinus = value;
      else if (field === "goals") row.goals = Math.round(value);
      else if (field === "assists") row.assists = Math.round(value);
      else if (field === "blocks") row.blocks = Math.round(value);
      else if (field === "drops") row.drops = value;
      else if (field === "throwaways") row.throwaways = value;
      else if (field === "stalls") row.stalls = Math.round(value);
      else if (field === "assistAttempts") row.assistAttempts = Math.round(value);
      else if (field === "greatests") row.greatests = Math.round(value);
      else if (field === "pulls") row.pulls = Math.round(value);
      else if (field === "pullsIB") row.pullsIB = Math.round(value);
      else if (field === "pullsOOB") row.pullsOOB = Math.round(value);
      else if (field === "callahansCaught") row.callahansCaught = Math.round(value);
      else if (field === "callahansThrown") row.callahansThrown = Math.round(value);
      else if (field === "twoPointGoals") row.twoPointGoals = Math.round(value);
      else if (field === "twoPointAssists") row.twoPointAssists = Math.round(value);
      else if (field === "twoPointTurnovers") row.twoPointTurnovers = Math.round(value);
    });
  });
}

function getRows(scope) {
  let rows;

  if (scope.indexOf("game_") === 0) {
    // Single game: use pre-computed playerStats from that game
    const gameId = scope.slice("game_".length);
    const game = DATA.games.find(g => g.id === gameId);
    rows = game ? game.playerStats.map(p => ({...p})) : [];
  }
  else if (scope === "lifetime" || scope.indexOf("tournament_") === 0) {
    // Aggregate: sum playerStats from all relevant games
    rows = aggregatePlayerStats(scope);
  }
  else {
    rows = [];
  }

  // Compute ONLY truly derived stats (don't recalculate base stats)
  rows.forEach(row => {
    computeDerived(row);
  });
  // Include all players who have any stats (not just pointsPlayed),
  // to match app behavior for players who may have plays but not appear in lineups
  return rows.filter(r => r.pointsPlayed > 0 || r.goals > 0 || r.blocks > 0 || r.assists > 0 || r.drops > 0 || r.throwaways > 0 || r.stalls > 0).sort((a, b) => a.name.localeCompare(b.name));
}

function aggregateGameStats(scope) {
  // For tournament/lifetime: compute each game's stats with overrides, then aggregate
  let games = [];
  if (scope === "lifetime") {
    games = DATA.games;
  } else if (scope.indexOf("tournament_") === 0) {
    const name = scope.slice("tournament_".length);
    games = DATA.games.filter(g => g.tournament === name);
  }

  // Compute corrected stats for each game and aggregate
  const aggregated = {};
  games.forEach(game => {
    const gameStats = computeBoxScore(DATA.roster, game.points);
    applyOverrides(gameStats, game.statOverrides);

    // Aggregate stats from this game
    gameStats.forEach(row => {
      if (!aggregated[row.id]) {
        aggregated[row.id] = emptyRow(row);
      }
      const agg = aggregated[row.id];
      agg.pointsPlayed += row.pointsPlayed;
      agg.oPoints += row.oPoints;
      agg.dPoints += row.dPoints;
      agg.oLinePointsPlayed += row.oLinePointsPlayed;
      agg.dLinePointsPlayed += row.dLinePointsPlayed;
      agg.goals += row.goals;
      agg.assists += row.assists;
      agg.blocks += row.blocks;
      agg.drops += row.drops;
      agg.throwaways += row.throwaways;
      agg.stalls += row.stalls;
      agg.greatests += row.greatests;
      agg.pulls += row.pulls;
      agg.pullsIB += row.pullsIB;
      agg.pullsOOB += row.pullsOOB;
      agg.callahansCaught += row.callahansCaught;
      agg.callahansThrown += row.callahansThrown;
      agg.twoPointGoals += row.twoPointGoals;
      agg.twoPointAssists += row.twoPointAssists;
      agg.twoPointTurnovers += row.twoPointTurnovers;
      agg.assistAttempts += row.assistAttempts;
      agg.onFieldGoalsFor += row.onFieldGoalsFor;
      agg.onFieldGoalsAgainst += row.onFieldGoalsAgainst;
      agg.oLineGoalsCredit += row.oLineGoalsCredit;
      agg.oLineBreaks += row.oLineBreaks;
      agg.dLineGoalsCredit += row.dLineGoalsCredit;
      agg.dLineBreaks += row.dLineBreaks;
      agg.completions += row.completions;
      agg.catches += row.catches;
      agg.defensiveBreaks += row.defensiveBreaks;
      agg.totalHangTime += row.totalHangTime;
      agg.plusMinus += row.plusMinus;
      agg.oPlusMinus += row.oPlusMinus;
      agg.dPlusMinus += row.dPlusMinus;
    });
  });

  return Object.values(aggregated);
}

function aggregatePlayerStats(scope) {
  // For tournament/lifetime: sum pre-computed playerStats from all relevant games
  let games = [];
  if (scope === "lifetime") {
    games = DATA.games;
  } else if (scope.indexOf("tournament_") === 0) {
    const name = scope.slice("tournament_".length);
    games = DATA.games.filter(g => g.tournament === name);
  }

  // Sum playerStats from each game's pre-computed stats
  const aggregated = {};
  games.forEach(game => {
    if (game.playerStats) {
      game.playerStats.forEach(playerStats => {
        if (!aggregated[playerStats.id]) {
          aggregated[playerStats.id] = emptyRow({ id: playerStats.id, name: playerStats.name, number: playerStats.number });
        }
        const agg = aggregated[playerStats.id];
        agg.name = playerStats.name;
        agg.number = playerStats.number;
        agg.pointsPlayed += playerStats.pointsPlayed;
        agg.oPoints += (playerStats.oPoints || 0);
        agg.dPoints += (playerStats.dPoints || 0);
        agg.goals += playerStats.goals;
        agg.assists += playerStats.assists;
        agg.blocks += playerStats.blocks;
        agg.drops += playerStats.drops;
        agg.throwaways += playerStats.throwaways;
        agg.stalls += playerStats.stalls;
        agg.greatests += playerStats.greatests;
        agg.pulls += playerStats.pulls;
        agg.pullsIB += playerStats.pullsIB;
        agg.pullsOOB += playerStats.pullsOOB;
        agg.callahansCaught += playerStats.callahansCaught;
        agg.callahansThrown += playerStats.callahansThrown;
        agg.twoPointGoals += playerStats.twoPointGoals;
        agg.twoPointAssists += playerStats.twoPointAssists;
        agg.twoPointTurnovers += playerStats.twoPointTurnovers;
        agg.assistAttempts += playerStats.assistAttempts;
        agg.catches += playerStats.catches;
        agg.completions += playerStats.completions;
        agg.onFieldGoalsFor += playerStats.onFieldGoalsFor;
        agg.onFieldGoalsAgainst += playerStats.onFieldGoalsAgainst;
        agg.oLineGoalsCredit += (playerStats.oLineGoalsCredit || 0);
        agg.oLineBreaks += (playerStats.oLineBreaks || 0);
        agg.oLinePointsPlayed += (playerStats.oLinePointsPlayed || 0);
        agg.dLineGoalsCredit += (playerStats.dLineGoalsCredit || 0);
        agg.dLineBreaks += (playerStats.dLineBreaks || 0);
        agg.dLinePointsPlayed += (playerStats.dLinePointsPlayed || 0);
        agg.plusMinus += playerStats.plusMinus;
        agg.oPlusMinus += (playerStats.oPlusMinus || 0);
        agg.dPlusMinus += (playerStats.dPlusMinus || 0);
        agg.hockeyAssists += (playerStats.hockeyAssists || 0);
        agg.scoredOn += (playerStats.scoredOn || 0);
      });
    }
  });

  return Object.values(aggregated);
}

// MARK: - Advanced team metrics (point-sequence analysis; non-Vic-Mode points only)

function computeTeamMetrics(points) {
  let oPointsCount = 0, oPointsScored = 0;
  let blocksTotal = 0, blocksConverted = 0;
  let dirtyHolds = 0, totalScoredPoints = 0, pointsAnalyzed = 0;

  points.forEach(point => {
    pointsAnalyzed += 1;
    if (point.startingPossession === "offense") oPointsCount += 1;

    let weHadDisc = point.startingPossession === "offense";
    let weTurnedItOver = false, weReclaimed = false, weScored = false;
    let blocksThisPoint = 0;

    point.plays.forEach(play => {
      switch (play.type) {
        case "goal": case "twoPointGoal": case "callahanCaught":
          weScored = true; break;
        case "theyScored": case "scoredOnTwoPoint": case "callahanThrown":
          weScored = false; break;
        case "drop": case "throwaway": case "twoPointThrowaway":
        case "stall": case "assistAttempt":
          if (weHadDisc) { weTurnedItOver = true; weHadDisc = false; }
          break;
        case "block":
          blocksTotal += 1;
          blocksThisPoint += 1;
          if (!weHadDisc) { weHadDisc = true; if (weTurnedItOver) weReclaimed = true; }
          break;
        case "theyTurnedItOver":
          weHadDisc = true; break;
        default: break;
      }
    });

    if (point.startingPossession === "offense" && weScored) oPointsScored += 1;
    if (weScored) {
      totalScoredPoints += 1;
      if (weTurnedItOver && weReclaimed) dirtyHolds += 1;
      blocksConverted += blocksThisPoint;
    }
  });

  return {
    oPointsCount, oPointsScored,
    conversionPct: blocksTotal > 0 ? Math.round(blocksConverted / blocksTotal * 1000) / 10 : null,
    conversionCount: blocksConverted, blocksTotal,
    dirtyHolds, totalScoredPoints, pointsAnalyzed
  };
}

// MARK: - Thrown-To chart (ports ThrownToChartView's bubble-pack algorithm)

function computeThrownToBubbles(points, throwerId, roster) {
  const catchMap = {}, goalMap = {}, dropMap = {};
  let otherTeamCount = 0;

  points.forEach(point => {
    const plays = point.plays;
    plays.forEach((event, i) => {
      switch (event.type) {
        case "pass":
          if (event.player1Id === throwerId && event.player2Id) {
            catchMap[event.player2Id] = (catchMap[event.player2Id] || 0) + 1;
          }
          break;
        case "goal": case "twoPointGoal":
          if (event.player2Id === throwerId && event.player1Id) {
            goalMap[event.player1Id] = (goalMap[event.player1Id] || 0) + 1;
          }
          break;
        case "drop":
          if (event.player1Id) {
            const dropper = event.player1Id;
            let j = i - 1;
            while (j >= 0) {
              const prev = plays[j];
              if (prev.type === "pass" && prev.player2Id === dropper) {
                if (prev.player1Id === throwerId) dropMap[dropper] = (dropMap[dropper] || 0) + 1;
                break;
              }
              j -= 1;
            }
          }
          break;
        case "throwaway": case "twoPointThrowaway": case "stall":
        case "callahanThrown": case "assistAttempt":
          if (event.player1Id === throwerId) otherTeamCount += 1;
          break;
        default: break;
      }
    });
  });

  const ids = new Set([].concat(Object.keys(catchMap), Object.keys(goalMap), Object.keys(dropMap)));
  const result = [];
  ids.forEach(rid => {
    const player = roster.find(p => p.id === rid);
    const name = player ? player.name : "?";
    const c = catchMap[rid] || 0, g = goalMap[rid] || 0, d = dropMap[rid] || 0;
    if (c + g + d > 0) result.push({ name: name, completions: c, goals: g, drops: d, isOtherTeam: false, total: c + g + d });
  });
  if (otherTeamCount > 0) {
    result.push({ name: "Other Team", completions: otherTeamCount, goals: 0, drops: 0, isOtherTeam: true, total: otherTeamCount });
  }
  result.sort((a, b) => b.total - a.total);
  return result;
}

function bubbleColor(b) {
  if (b.isOtherTeam) return "#FF9E00";
  if (b.goals > 0 && b.goals >= b.completions && b.goals >= b.drops) return "#26FF66";
  if (b.drops > b.completions && b.drops > b.goals) return "#FF477A";
  return "#8CC747";
}

function bubbleRadius(total, scale, minRadius) {
  return Math.max(minRadius, Math.sqrt(Math.max(1, total)) * scale);
}

function packBubbles(bubbles, width, height) {
  if (width <= 0 || height <= 0) return [];
  const scale = 15;
  const cx = width / 2, cy = height / 2;
  const maxPossibleR = Math.min(width, height) / 2;
  let minRadius;
  if (bubbles.length === 1) minRadius = Math.min(maxPossibleR * 0.6, 70);
  else if (bubbles.length === 2) minRadius = Math.min(maxPossibleR * 0.4, 50);
  else if (bubbles.length === 3) minRadius = Math.min(maxPossibleR * 0.3, 40);
  else minRadius = 12;  // reduced from 24 to allow better scaling of small values

  const placed = [];
  bubbles.forEach(bubble => {
    const r = bubbleRadius(bubble.total, scale, minRadius);
    if (placed.length === 0) {
      placed.push({ x: cx, y: cy, r: r, bubble: bubble });
      return;
    }
    let bestX = cx, bestY = cy, bestDist = Infinity, found = false;
    placed.forEach(existing => {
      const gap = existing.r + r + 3;
      for (let ideg = 0; ideg < 360; ideg += 5) {
        const rad = ideg * Math.PI / 180;
        const px = existing.x + gap * Math.cos(rad);
        const py = existing.y + gap * Math.sin(rad);
        if (px - r < 1 || px + r > width - 1 || py - r < 1 || py + r > height - 1) continue;
        const overlaps = placed.some(p => Math.hypot(p.x - px, p.y - py) < p.r + r - 1);
        if (!overlaps) {
          const d = Math.hypot(px - cx, py - cy);
          if (d < bestDist) { bestDist = d; bestX = px; bestY = py; found = true; }
        }
      }
    });
    placed.push({ x: found ? bestX : cx, y: found ? bestY : cy, r: r, bubble: bubble });
  });

  return placed;
}

function buildThrownToLegend() {
  const items = [["Catches", "#8CC747"], ["Goals", "#26FF66"], ["Drops", "#FF477A"], ["Turnovers", "#FF9E00"]];
  const wrap = document.createElement("div");
  wrap.className = "bubble-legend";
  items.forEach(([label, color]) => {
    const span = document.createElement("span");
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = color;
    span.appendChild(dot);
    span.appendChild(document.createTextNode(label));
    wrap.appendChild(span);
  });
  return wrap;
}

function buildThrownToChart(points, throwerId, roster) {
  const bubbles = computeThrownToBubbles(points, throwerId, roster);
  const container = document.createElement("div");
  container.className = "bubble-chart";

  function render() {
    const width = container.clientWidth;
    container.innerHTML = "";
    if (bubbles.length === 0) {
      const empty = document.createElement("div");
      empty.className = "bubble-empty";
      empty.textContent = "No throwing data recorded";
      container.appendChild(empty);
      return;
    }
    const placed = packBubbles(bubbles, width, 260);
    placed.forEach(p => {
      const el = document.createElement("div");
      el.className = "bubble";
      el.style.width = (p.r * 2) + "px";
      el.style.height = (p.r * 2) + "px";
      el.style.left = (p.x - p.r) + "px";
      el.style.top = (p.y - p.r) + "px";
      el.style.background = bubbleColor(p.bubble);
      const count = document.createElement("div");
      count.className = "bubble-count";
      count.textContent = String(p.bubble.total);
      el.appendChild(count);
      if (p.r > 22) {
        const name = document.createElement("div");
        name.className = "bubble-name";
        name.textContent = p.bubble.name;
        el.appendChild(name);
      }
      container.appendChild(el);
    });
  }

  requestAnimationFrame(render);
  window.addEventListener("resize", render);
  return container;
}

// MARK: - Leaderboard cards

// criteria: array of [field, dir] — dir 1 means higher wins, -1 means
// lower wins. The first entry is the headline stat; later entries only
// matter when every earlier one is exactly tied, and break the tie in
// order. If every criterion is tied, the earlier row wins — rows arrive
// pre-sorted alphabetically, so a total tie just resolves to whoever's
// first by name (deterministic, but not a meaningful ranking).
function findLeader(rows, criteria) {
  let best = null;
  rows.forEach(r => {
    if (typeof r[criteria[0][0]] !== "number") return;
    if (!best) { best = r; return; }
    for (const [field, dir] of criteria) {
      if (r[field] === best[field]) continue;
      if ((r[field] > best[field]) === (dir > 0)) best = r;
      break;
    }
  });
  return best;
}

function leaderCard(title, leader, lines) {
  const card = document.createElement("div");
  card.className = "leader-card";
  const h = document.createElement("div");
  h.className = "leader-title";
  h.textContent = title;
  card.appendChild(h);
  if (!leader) {
    const none = document.createElement("div");
    none.className = "leader-none";
    none.textContent = "—";
    card.appendChild(none);
    return card;
  }
  const name = document.createElement("div");
  name.className = "leader-name";
  name.textContent = leader.name;
  card.appendChild(name);
  lines.forEach(([label, val]) => {
    const line = document.createElement("div");
    line.className = "leader-stat";
    line.textContent = label + ": " + formatValue(val);
    card.appendChild(line);
  });
  return card;
}

function buildLeaderboard(rows) {
  const wrap = document.createElement("div");
  wrap.className = "leaderboard";
  // Secondary stats break ties: fewer D-points for the same blocks
  // (more efficient defender), more assists for the same goals (more
  // involved scorer), fewer points played for the same +/- (more
  // impactful per point), more touches for the same points played
  // (busier while on the field).
  const dLeader = findLeader(rows, [["blocks", 1], ["dPoints", -1]]);
  const oLeader = findLeader(rows, [["offensiveOutput", 1], ["touches", 1]]);
  const pmLeader = findLeader(rows, [["plusMinus", 1], ["pointsPlayed", -1]]);
  const ptLeader = findLeader(rows, [["pointsPlayed", 1], ["touches", 1]]);
  wrap.appendChild(leaderCard("Defense", dLeader, dLeader ? [["Ds", dLeader.blocks], ["D Points", dLeader.dPoints], ["Pulls", dLeader.pulls]] : []));
  wrap.appendChild(leaderCard("Offense", oLeader, oLeader ? [["G+A", oLeader.offensiveOutput], ["Goals", oLeader.goals], ["Assists", oLeader.assists]] : []));
  wrap.appendChild(leaderCard("Plus/Minus", pmLeader, pmLeader ? [["+/-", pmLeader.plusMinus], ["O+/-", pmLeader.oPlusMinus], ["D+/-", pmLeader.dPlusMinus]] : []));
  wrap.appendChild(leaderCard("Playing Time", ptLeader, ptLeader ? [["Points Played", ptLeader.pointsPlayed], ["O Points", ptLeader.oPoints], ["D Points", ptLeader.dPoints]] : []));
  return wrap;
}

// MARK: - Player detail overlay

function computeTeamAverages(rows) {
  const avg = {};
  COLUMNS.forEach(([field]) => {
    const vals = rows.map(r => r[field]).filter(v => typeof v === "number");
    avg[field] = vals.length > 0 ? Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 100) / 100 : null;
  });
  return avg;
}

function openPlayerDetail(scope, playerId) {
  const rows = getRows(scope);
  const row = rows.find(r => r.id === playerId);
  if (!row) return;
  const avg = computeTeamAverages(rows);
  const points = getPoints(scope);

  const overlay = document.createElement("div");
  overlay.className = "overlay";
  const panel = document.createElement("div");
  panel.className = "overlay-panel";

  const closeBtn = document.createElement("button");
  closeBtn.className = "action";
  closeBtn.textContent = "← Back";
  closeBtn.addEventListener("click", () => overlay.remove());
  panel.appendChild(closeBtn);

  const h1 = document.createElement("h2");
  h1.textContent = row.number ? ("#" + row.number + " " + row.name) : row.name;
  panel.appendChild(h1);

  const wrap = document.createElement("div");
  wrap.className = "table-wrap";
  const table = document.createElement("table");
  table.innerHTML = "<thead><tr><th>Stat</th><th>Player</th><th>Team Avg</th></tr></thead>";
  const tbody = document.createElement("tbody");
  COLUMNS.forEach(([field, label]) => {
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>" + label + "</td><td>" + formatValue(row[field]) + "</td><td>" + formatValue(avg[field]) + "</td>";
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  panel.appendChild(wrap);

  const chartHeader = document.createElement("h3");
  chartHeader.textContent = "Who " + row.name + " Throws To";
  chartHeader.style.marginTop = "20px";
  panel.appendChild(chartHeader);
  panel.appendChild(buildThrownToLegend());
  panel.appendChild(buildThrownToChart(points, playerId, DATA.roster));

  overlay.appendChild(panel);
  document.body.appendChild(overlay);
}

// MARK: - Table rendering

function buildTable(scope) {
  const wrap = document.createElement("div");
  wrap.className = "table-wrap";
  const table = document.createElement("table");
  wrap.appendChild(table);
  renderTable(table, scope);

  // Add events section for game-specific views
  if (scope.indexOf("game_") === 0) {
    const gameId = scope.slice("game_".length);
    const game = DATA.games.find(g => g.id === gameId);
    if (game && game.points && game.points.length > 0) {
      const eventsDiv = document.createElement("div");
      eventsDiv.style.marginTop = "30px";

      const h3 = document.createElement("h3");
      h3.textContent = "Game Events";
      h3.style.marginBottom = "10px";
      eventsDiv.appendChild(h3);

      const eventsTable = document.createElement("table");
      eventsTable.style.width = "100%";
      eventsTable.style.borderCollapse = "collapse";
      eventsTable.style.fontSize = "12px";

      const thead = document.createElement("thead");
      thead.innerHTML = "<tr><th style='border: 1px solid #ccc; padding: 8px; text-align: left;'>Point</th><th style='border: 1px solid #ccc; padding: 8px; text-align: left;'>Event</th><th style='border: 1px solid #ccc; padding: 8px; text-align: left;'>Player</th><th style='border: 1px solid #ccc; padding: 8px; text-align: left;'>Player 2</th></tr>";
      eventsTable.appendChild(thead);

      const tbody = document.createElement("tbody");
      game.points.forEach(point => {
        point.plays.forEach(play => {
          const tr = document.createElement("tr");
          tr.style.borderBottom = "1px solid #eee";
          const p1Name = play.player1Id ? (DATA.roster.find(p => p.id === play.player1Id)?.name || play.player1Id) : "-";
          const p2Name = play.player2Id ? (DATA.roster.find(p => p.id === play.player2Id)?.name || play.player2Id) : "-";
          tr.innerHTML = "<td style='border: 1px solid #ccc; padding: 8px;'>" + point.pointNumber + "</td>" +
                         "<td style='border: 1px solid #ccc; padding: 8px;'>" + play.type + "</td>" +
                         "<td style='border: 1px solid #ccc; padding: 8px;'>" + p1Name + "</td>" +
                         "<td style='border: 1px solid #ccc; padding: 8px;'>" + p2Name + "</td>";
          tbody.appendChild(tr);
        });
      });
      eventsTable.appendChild(tbody);
      eventsDiv.appendChild(eventsTable);
      wrap.appendChild(eventsDiv);
    }
  }

  return wrap;
}

function renderTable(table, scope) {
  table.innerHTML = "";
  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  const nameTh = document.createElement("th");
  nameTh.textContent = "Player";
  headRow.appendChild(nameTh);
  COLUMNS.forEach(([field, label]) => {
    const th = document.createElement("th");
    th.textContent = label;
    th.dataset.field = field;
    th.addEventListener("click", () => sortTable(table, scope, field));
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);
  table.appendChild(document.createElement("tbody"));
  renderRows(table, scope, getRows(scope));
}

function renderRows(table, scope, rows) {
  table._rows = rows;
  const tbody = table.querySelector("tbody");
  tbody.innerHTML = "";
  rows.forEach(row => {
    const tr = document.createElement("tr");
    const nameTd = document.createElement("td");
    nameTd.textContent = row.number ? ("#" + row.number + " " + row.name) : row.name;
    nameTd.className = "player-link";
    nameTd.addEventListener("click", () => openPlayerDetail(scope, row.id));
    tr.appendChild(nameTd);
    COLUMNS.forEach(([field]) => {
      const td = document.createElement("td");
      td.textContent = formatValue(row[field]);
      td.classList.add("computed");
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

let sortState = {};
function sortTable(table, scope, field) {
  const key = scope + "_" + field;
  const dir = sortState[key] === "asc" ? "desc" : "asc";
  sortState = {}; sortState[key] = dir;
  const rows = table._rows.slice().sort((a, b) => {
    const av = (typeof a[field] === "number") ? a[field] : -Infinity;
    const bv = (typeof b[field] === "number") ? b[field] : -Infinity;
    return dir === "asc" ? av - bv : bv - av;
  });
  table.querySelectorAll("th").forEach(th => th.classList.remove("sorted", "sorted-asc"));
  const th = table.querySelector('th[data-field="' + field + '"]');
  if (th) th.classList.add(dir === "asc" ? "sorted-asc" : "sorted");
  renderRows(table, scope, rows);
}

function exportEditedCSV(scope, filename) {
  const rows = getRows(scope);
  const header = ["Player"].concat(COLUMNS.map(c => c[1]));
  const lines = [header.join(",")];
  rows.forEach(row => {
    const line = [row.number ? ("#" + row.number + " " + row.name) : row.name];
    COLUMNS.forEach(([field]) => line.push(formatValue(row[field])));
    lines.push(line.join(","));
  });
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildLegend() {
  const wrap = document.createElement("div");
  wrap.className = "legend";
  const title = document.createElement("div");
  title.className = "legend-title";
  title.textContent = "Stat Key";
  wrap.appendChild(title);
  const groups = [["plusminus", "Plus/Minus"], ["offense", "Offense"], ["defense", "Defense"], ["calc", "Calculated"]];
  let html = "";
  groups.forEach(([groupKey, groupLabel]) => {
    const cols = COLUMNS.filter(c => c[3] === groupKey);
    if (!cols.length) return;
    html += "<div><b>" + groupLabel + ":</b> " + cols.map(c => c[1] + " = " + c[2]).join(" · ") + "</div>";
  });
  const body = document.createElement("div");
  body.innerHTML = html;
  wrap.appendChild(body);
  return wrap;
}

function summaryCards(items) {
  const wrap = document.createElement("div");
  wrap.className = "summary-cards";
  items.forEach(([label, value]) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = '<div class="label"></div><div class="value"></div>';
    card.querySelector(".label").textContent = label;
    card.querySelector(".value").textContent = value;
    wrap.appendChild(card);
  });
  return wrap;
}

function buildGameTeamStats(game) {
  const ts = game.teamStats;
  const wrap = document.createElement("div");
  wrap.appendChild(summaryCards([
    ["Goals For", ts.goalsFor], ["Goals Against", ts.goalsAgainst],
    ["Plus/Minus", (ts.goalsFor - ts.goalsAgainst >= 0 ? "+" : "") + (ts.goalsFor - ts.goalsAgainst)],
    ["Points Won", ts.pointsWon + " / " + ts.pointsPlayed],
    ["Point %", ts.pointPercentage !== null ? (ts.pointPercentage.toFixed(1) + "%") : "*"],
    ["Completions", ts.completions], ["Blocks", ts.blocks]
  ]));
  return wrap;
}

function buildTeamMetricsSection(points) {
  const m = computeTeamMetrics(points);
  const wrap = document.createElement("div");
  wrap.appendChild(summaryCards([
    ["O-Points Scored", m.oPointsScored + " / " + m.oPointsCount],
    ["D Conversion %", m.conversionPct !== null ? (m.conversionPct + "%") : "*"],
    ["D Conversions", m.conversionCount + " / " + m.blocksTotal],
    ["Dirty Holds", m.dirtyHolds + " / " + m.totalScoredPoints]
  ]));
  const note = document.createElement("div");
  note.className = "hint";
  note.textContent = "Offensive Efficiency: % of points starting on offense that ended in a goal. D Conversion: % of blocks whose point ended in a goal. Dirty Hold: scored a point despite turning it over and getting it back first. Vic Mode points are excluded (no fixed \"us\" team).";
  wrap.appendChild(note);
  return wrap;
}

// MARK: - App shell

function buildApp() {
  const app = document.getElementById("app");

  const header = document.createElement("header");
  header.innerHTML = "<h1></h1><p></p>";
  header.querySelector("h1").textContent = DATA.teamName + " — Stats";
  header.querySelector("p").textContent = "Generated " + DATA.generatedAt;
  if (DATA.sheetsURL) {
    const link = document.createElement("a");
    link.href = DATA.sheetsURL;
    link.target = "_blank";
    link.rel = "noopener";
    link.className = "sheets-link";
    link.textContent = "Open editable Google Sheet ↗";
    header.appendChild(link);
  }
  app.appendChild(header);

  const tabs = document.createElement("div");
  tabs.className = "tabs";
  const tabDefs = [["lifetime","Lifetime"], ["tournaments","Tournaments"], ["games","Games"], ["team","Team"]];
  const panels = {};

  tabDefs.forEach(([key, label], i) => {
    const btn = document.createElement("button");
    btn.className = "tab" + (i === 0 ? " active" : "");
    btn.textContent = label;
    btn.addEventListener("click", () => {
      tabs.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      Object.values(panels).forEach(p => p.classList.remove("active"));
      panels[key].classList.add("active");
    });
    tabs.appendChild(btn);
  });
  app.appendChild(tabs);

  // Lifetime panel
  const lifetimePanel = document.createElement("div");
  lifetimePanel.className = "panel active";
  const lifeToolbar = document.createElement("div");
  lifeToolbar.className = "toolbar";
  const lifeExportBtn = document.createElement("button");
  lifeExportBtn.className = "action";
  lifeExportBtn.textContent = "Export Edited CSV";
  lifeExportBtn.addEventListener("click", () => exportEditedCSV("lifetime", "lifetime_stats.csv"));
  lifeToolbar.appendChild(lifeExportBtn);
  lifetimePanel.appendChild(lifeToolbar);
  lifetimePanel.appendChild(buildLeaderboard(getRows("lifetime")));
  lifetimePanel.appendChild(buildLegend());
  lifetimePanel.appendChild(buildTable("lifetime"));
  panels.lifetime = lifetimePanel;
  app.appendChild(lifetimePanel);

  // Tournaments panel
  const tournamentsPanel = document.createElement("div");
  tournamentsPanel.className = "panel";
  const tSelect = document.createElement("select");
  DATA.tournamentNames.forEach(name => {
    const opt = document.createElement("option");
    opt.value = name; opt.textContent = name;
    tSelect.appendChild(opt);
  });
  tournamentsPanel.appendChild(tSelect);
  const tTableHolder = document.createElement("div");
  tournamentsPanel.appendChild(tTableHolder);
  function renderTournament() {
    const name = tSelect.value || DATA.tournamentNames[0];
    tTableHolder.innerHTML = "";
    if (!name) return;
    const scope = "tournament_" + name;
    const ts = DATA.tournamentSummaries.find(t => t.name === name);
    const toolbar = document.createElement("div");
    toolbar.className = "toolbar";
    const btn = document.createElement("button");
    btn.className = "action";
    btn.textContent = "Export Edited CSV";
    btn.addEventListener("click", () => exportEditedCSV(scope, name + "_stats.csv"));
    toolbar.appendChild(btn);
    tTableHolder.appendChild(toolbar);
    if (ts) {
      tTableHolder.appendChild(summaryCards([
        ["Games", ts.gamesPlayed],
        ["Record", ts.wins + "-" + ts.losses + "-" + ts.ties],
        ["Points For", ts.pointsFor],
        ["Points Against", ts.pointsAgainst],
        ["Differential", (ts.pointsFor - ts.pointsAgainst >= 0 ? "+" : "") + (ts.pointsFor - ts.pointsAgainst)]
      ]));
    }
    tTableHolder.appendChild(buildLeaderboard(getRows(scope)));
    tTableHolder.appendChild(buildLegend());
    tTableHolder.appendChild(buildTable(scope));
  }
  tSelect.addEventListener("change", renderTournament);
  if (DATA.tournamentNames.length) renderTournament();
  panels.tournaments = tournamentsPanel;
  app.appendChild(tournamentsPanel);

  // Games panel
  const gamesPanel = document.createElement("div");
  gamesPanel.className = "panel";
  const gSelect = document.createElement("select");
  DATA.games.slice().reverse().forEach(g => {
    const opt = document.createElement("option");
    opt.value = g.id; opt.textContent = g.label;
    gSelect.appendChild(opt);
  });
  gamesPanel.appendChild(gSelect);
  const gTableHolder = document.createElement("div");
  gamesPanel.appendChild(gTableHolder);
  function renderGame() {
    const g = DATA.games.find(x => x.id === gSelect.value) || DATA.games[DATA.games.length - 1];
    gTableHolder.innerHTML = "";
    if (!g) return;
    const scope = "game_" + g.id;
    const toolbar = document.createElement("div");
    toolbar.className = "toolbar";
    const btn = document.createElement("button");
    btn.className = "action";
    btn.textContent = "Export Edited CSV";
    btn.addEventListener("click", () => exportEditedCSV(scope, g.opponent + "_" + g.date + ".csv"));
    toolbar.appendChild(btn);
    gTableHolder.appendChild(toolbar);
    gTableHolder.appendChild(buildGameTeamStats(g));
    gTableHolder.appendChild(buildLeaderboard(getRows(scope)));
    gTableHolder.appendChild(buildLegend());
    gTableHolder.appendChild(buildTable(scope));
  }
  gSelect.addEventListener("change", renderGame);
  if (DATA.games.length) renderGame();
  panels.games = gamesPanel;
  app.appendChild(gamesPanel);

  // Team panel
  const teamPanel = document.createElement("div");
  teamPanel.className = "panel";
  const t = DATA.team;
  teamPanel.appendChild(summaryCards([
    ["Games", t.gamesPlayed], ["Record", t.wins + "-" + t.losses + "-" + t.ties],
    ["Points For", t.pointsFor], ["Points Against", t.pointsAgainst],
    ["Differential", (t.pointsFor - t.pointsAgainst >= 0 ? "+" : "") + (t.pointsFor - t.pointsAgainst)]
  ]));
  const h2 = document.createElement("h3");
  h2.textContent = "Advanced Metrics";
  h2.style.marginTop = "20px";
  teamPanel.appendChild(h2);
  teamPanel.appendChild(buildTeamMetricsSection(DATA.games.flatMap(g => g.points)));
  if (DATA.tournamentSummaries.length) {
    const h3 = document.createElement("h3");
    h3.textContent = "By Tournament";
    h3.style.marginTop = "20px";
    teamPanel.appendChild(h3);
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    const table = document.createElement("table");
    table.innerHTML = "<thead><tr><th>Tournament</th><th>GP</th><th>W</th><th>L</th><th>T</th><th>PF</th><th>PA</th></tr></thead>";
    const tbody = document.createElement("tbody");
    DATA.tournamentSummaries.forEach(ts => {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td>" + ts.name + "</td><td>" + ts.gamesPlayed + "</td><td>" + ts.wins + "</td><td>" + ts.losses + "</td><td>" + ts.ties + "</td><td>" + ts.pointsFor + "</td><td>" + ts.pointsAgainst + "</td>";
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    teamPanel.appendChild(wrap);
  }
  panels.team = teamPanel;
  app.appendChild(teamPanel);
}

buildApp();
</script>
